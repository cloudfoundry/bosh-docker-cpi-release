name: go
on:
  push:
    paths:
    - 'src/bosh-docker-cpi/**'
    - '.github/**'
  pull_request:
    paths:
    - 'src/bosh-docker-cpi/**'
    - '.github/**'
permissions:
  contents: read

jobs:
  lint: # <- name
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: src/bosh-docker-cpi/go.mod
    - run: scripts/go-generate
    - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
      with:
        working-directory: src/bosh-docker-cpi/

  test-unit: # <- name
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: src/bosh-docker-cpi/go.mod
    - run: scripts/test-unit
